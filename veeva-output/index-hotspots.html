    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #000;
        color: white;
        overflow: hidden;
      }

      /* Main container - matches original styles */
      .video-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        color: white;
        width: 100%;
        position: relative;
      }

      .video-subcontainer {
        position: relative;
        width: 100%;
        overflow: hidden;
        background-color: black;
      }

      /* Enhanced video controls container */
      .video-controls-group {
        position: relative;
      }

      .video-controls-group:hover .video-controls-overlay {
        opacity: 1;
      }

      /* Fullscreen toggle button (hidden initially) */
      .fullscreen-toggle {
        pointer-events: auto;
        z-index: 50;
        display: none;
      }

      .fullscreen-button {
        color: rgba(255, 255, 255, 0.8);
        border: 2px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(4px);
        padding: 12px 16px;
        position: absolute;
        z-index: 30;
        top: 16px;
        right: 16px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .fullscreen-button:hover {
        border-color: white;
        color: white;
        transform: scale(1.05);
      }

      .fullscreen-button:active {
        transform: scale(0.95);
      }

      /* Close button for overlay videos */
      .close-button {
        position: absolute;
        z-index: 30;
        right: 16px;
        top: 16px;
        padding: 12px 20px;
        background: rgba(255, 255, 255, 0.8);
        color: black;
        border: 1px solid #d1d5db;
        border-radius: 9999px;
        transition: all 0.3s ease;
        cursor: pointer;
        visibility: hidden;
      }

      .close-button:hover {
        background: white;
        border-color: #9ca3af;
        transform: scale(1.05);
      }

      .close-button:active {
        transform: scale(0.95);
      }

      /* Video elements */
      .overlay-video {
        position: absolute;
        width: 100%;
        z-index: 20;
        visibility: hidden;
      }

      .main-video {
        width: 100%;
      }

      /* Hotspot button */
      .hotspot-button {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 112px;
        height: 112px;
        color: rgba(255, 255, 255, 0.9);
        font-weight: bold;
        filter: drop-shadow(0 25px 25px rgb(0 0 0 / 0.15));
        z-index: 10;
        left: 24px;
        bottom: 48px;
        font-size: 12px;
        line-height: 1;
        transition: all 0.3s ease-out;
        cursor: pointer;
        visibility: hidden;
        opacity: 0;
      }

      .hotspot-button:hover {
        transform: scale(1.1);
      }

      .hotspot-button:active {
        transform: scale(0.95);
      }

      .hotspot-button.visible {
        visibility: visible;
        opacity: 1;
      }

      .hotspot-button img {
        width: 112px;
        height: 112px;
      }

      /* Video controls overlay */
      .video-controls-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 30;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .video-controls-backdrop {
        backdrop-filter: blur(12px);
        background: rgba(0, 0, 0, 0.4);
        padding: 16px;
      }

      .controls-main {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .control-button {
        color: rgba(255, 255, 255, 0.9);
        transition: all 0.2s ease;
        padding: 8px;
        border: none;
        background: none;
        cursor: pointer;
        border-radius: 4px;
      }

      .control-button:hover {
        color: white;
        background: rgba(255, 255, 255, 0.1);
      }

      .control-button:active {
        transform: scale(0.95);
      }

      .time-display {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        font-family: monospace;
        min-width: 40px;
      }

      .progress-container {
        flex: 1;
        position: relative;
        cursor: pointer;
      }

      .progress-bar {
        height: 2px;
        background: rgba(255, 255, 255, 0.2);
        position: relative;
        overflow: hidden;
        transition: height 0.2s ease;
      }

      .progress-container:hover .progress-bar {
        height: 4px;
      }

      .progress-fill {
        height: 100%;
        background: white;
        transition: width 0.1s ease;
        width: 0%;
      }

      .progress-thumb {
        position: absolute;
        top: 50%;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
        left: 0%;
      }

      .progress-container:hover .progress-thumb {
        opacity: 1;
      }

      .volume-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .volume-controls:hover .volume-slider {
        opacity: 1;
      }

      .volume-slider {
        width: 64px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        position: relative;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .volume-fill {
        height: 100%;
        background: white;
        width: 100%;
      }

      /* Description area (initially hidden) */
      .description {
        width: 100%;
        max-width: 1024px;
        min-height: 50px;
        border: 2px solid #4b5563;
        padding: 8px;
        font-size: 14px;
        color: white;
        display: none;
      }

      /* Loading indicator */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        z-index: 10;
      }

      /* Error message */
      .error-message {
        position: absolute;
        top: 50%;
        left: 50%;

        text-align: center;
        color: white;
        background: rgba(0, 0, 0, 0.8);

      /* Hidden preload videos */
      .preload-videos {
        position: absolute;
        top: -9999px;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;

      /* Mobile responsive */

        }

          padding: 12px;
        }

        .controls-main {

        }
      }

      // Utility functions
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === null) return "0:00";
        var minutes = Math.floor(seconds / 60);
        var secs = Math.floor(seconds % 60);
        return minutes + ":" + (secs < 10 ? "0" : "") + secs;
      }

      function fadeInVolume(video, duration) {
        duration = duration || 1000;
        var originalVolume = video.volume;
        video.volume = 0;
        var startTime = Date.now();

        function fade() {
          var elapsed = Date.now() - startTime;
          var progress = Math.min(elapsed / duration, 1);
          video.volume = originalVolume * progress;

          if (progress < 1) {
            requestAnimationFrame(fade);
          }
        }
        requestAnimationFrame(fade);
      }

      function fadeInHotspot(element, duration) {
        duration = duration || 500;
        element.style.opacity = "0";
        element.style.visibility = "visible";
        element.style.transition = "opacity " + duration + "ms ease-out";

        // Force reflow
        element.offsetHeight;
        element.style.opacity = "1";
      }

      function fadeOutHotspot(element, duration) {
        duration = duration || 300;
        element.style.transition = "opacity " + duration + "ms ease-out";
        element.style.opacity = "0";

        setTimeout(function () {
          element.style.visibility = "hidden";
        }, duration);
      }

        hideError();

        if (mainVideo.duration && !isNaN(mainVideo.duration)) {
          duration.textContent = formatTime(mainVideo.duration);
          volumeFill.style.width = mainVideo.volume * 100 + "%";
        }
      }

      function hideLoading() {
        loadingIndicator.style.display = "none";
      }

      function onVideoError() {
        console.error("Video failed to load");
        showError();
      }

      function showError() {
        hideLoading();
        errorMessage.style.display = "block";
      }

      function hideError() {
        errorMessage.style.display = "none";
      }

      function retryVideo() {
        hideError();
        loadingIndicator.style.display = "block";
        mainVideo.load();
      }

      // Main time update handler with hotspot logic
      function handleTimeUpdate() {
        if (!videoLoaded) return;

        var currentVideoTime = mainVideo.currentTime;
        var overlayIsVisible = overlayVideo.style.visibility === "visible";
        var newHotspotIdx = -1;

        // Update progress bar
        if (mainVideo.duration && !isNaN(mainVideo.duration)) {
          var progress = (currentVideoTime / mainVideo.duration) * 100;
          progressFill.style.width = progress + "%";
          progressThumb.style.left = progress + "%";
          currentTime.textContent = formatTime(currentVideoTime);
        }

        // Only show hotspots if overlay is not visible
        if (!overlayIsVisible) {
          for (var i = 0; i < hotspots.length; i++) {
            if (
              currentVideoTime >= hotspots[i].startTime &&
              currentVideoTime < hotspots[i].endTime
            ) {
              newHotspotIdx = i;
              break;
            }
          }
        }

        // Show/hide hotspot button
        if (
          newHotspotIdx !== -1 &&
          newHotspotIdx !== currentHotspotIdx &&
          !overlayIsVisible
        ) {
          console.log("Showing hotspot:", newHotspotIdx);
          fadeInHotspot(hotspotButton);
          if (description) {
            description.innerHTML = hotspots[newHotspotIdx].text;
          }
          currentHotspotIdx = newHotspotIdx;
        } else if (newHotspotIdx === -1 || overlayIsVisible) {
          if (hotspotButton.style.visibility === "visible") {
            fadeOutHotspot(hotspotButton);
          }
          if (description) {
            description.innerHTML = "";
          }
          if (!overlayIsVisible) {
            currentHotspotIdx = -1;
          }
        }
      }

      // Hotspot click handler
      function handleHotspotClick() {
        console.log(
          "Hotspot clicked! Current hotspot index:",
          currentHotspotIdx
        );

        if (currentHotspotIdx >= 0 && currentHotspotIdx < hotspots.length) {
          var hotspot = hotspots[currentHotspotIdx];
          console.log("Playing hotspot video:", hotspot.link);

          // Show close button
          closeButton.style.visibility = "visible";

          // Pause main video
          mainVideo.pause();

          // Prepare overlay video
          overlayVideo.pause();
          overlayVideo.removeAttribute("src");
          overlayVideo.style.visibility = "hidden";

          setTimeout(function () {
            overlayVideo.setAttribute("src", hotspot.link);
            overlayVideo.load();
            overlayVideo.style.visibility = "visible";
            isOverlayVisible = true;

            overlayVideo.addEventListener("canplay", function onCanPlay() {
              overlayVideo.removeEventListener("canplay", onCanPlay);
              overlayVideo
                .play()
                .then(function () {
                  console.log("Overlay video playback started");
                })
                .catch(function (error) {
                  console.error("Error playing overlay video:", error);
                });
            });
          }, 50);
        }
      }

      // Overlay video ended handler
      function handleOverlayVideoEnded() {
        console.log("Overlay video ended");
        overlayVideo.style.visibility = "hidden";
        closeButton.style.visibility = "hidden";
        isOverlayVisible = false;

        // Resume main video
        mainVideo.play();
        fadeInVolume(mainVideo, 1000);
      }

      // Close button handler
      document.getElementById("closeButton").onclick = function () {
        console.log("Close button clicked");
        overlayVideo.pause();
        overlayVideo.style.visibility = "hidden";
        closeButton.style.visibility = "hidden";
        isOverlayVisible = false;

        // Resume main video
        mainVideo.play();
        fadeInVolume(mainVideo, 1000);
      };

      // Playback controls
      function togglePlay() {
        if (!videoLoaded) return;

        if (isOverlayVisible) {
          if (overlayVideo.paused) {
            overlayVideo.play();
          } else {
            overlayVideo.pause();
          }
          return;
        }

        if (mainVideo.paused) {
          mainVideo.play();
        } else {
          mainVideo.pause();
        }
      }

      function updatePlayButton() {
        if (isOverlayVisible) {
          playButton.textContent = overlayVideo.paused ? "▶" : "⏸";
        } else {
          playButton.textContent = mainVideo.paused ? "▶" : "⏸";
        }
      }

      function seekVideo(event) {
        if (!videoLoaded || !mainVideo.duration) return;
        if (isOverlayVisible) return; // Don't seek when overlay is visible

        var rect = event.target.getBoundingClientRect();
        var clickX = event.clientX - rect.left;
        var clickRatio = clickX / rect.width;
        mainVideo.currentTime = clickRatio * mainVideo.duration;
      }

      function skipTime(seconds) {
        if (!videoLoaded) return;

        if (isOverlayVisible) {
          overlayVideo.currentTime += seconds;
        } else {
          mainVideo.currentTime += seconds;
        }
      }

      function toggleMute() {
        if (!videoLoaded) return;

        if (isOverlayVisible) {
          overlayVideo.muted = !overlayVideo.muted;
          volumeButton.textContent = overlayVideo.muted ? "🔇" : "🔊";
        } else {
          mainVideo.muted = !mainVideo.muted;
          volumeButton.textContent = mainVideo.muted ? "🔇" : "🔊";
        }
      }

      function setVolume(event) {
        if (!videoLoaded) return;

        var rect = event.target.getBoundingClientRect();
        var clickX = event.clientX - rect.left;
        var volume = clickX / rect.width;
        volume = Math.max(0, Math.min(1, volume));

        if (isOverlayVisible) {
          overlayVideo.volume = volume;
        } else {
          mainVideo.volume = volume;
        }

        volumeFill.style.width = volume * 100 + "%";
      }

      function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            document
              .getElementById("video-player-subcontainer")
              .requestFullscreen();
          }
        } catch (e) {
          console.error("Fullscreen error:", e);
        }
      }

      function onVideoEnded() {
        updatePlayButton();
        fadeOutHotspot(hotspotButton);
      }

      // Show controls on mobile touch
      function showControlsTemporarily() {
        videoControlsOverlay.style.opacity = "1";
        setTimeout(function () {
          videoControlsOverlay.style.opacity = "0";
        }, 3000);
      }

      // Initialize
      function init() {
        // Set up overlay video events
        overlayVideo.addEventListener("ended", handleOverlayVideoEnded);
        overlayVideo.addEventListener("play", updatePlayButton);
        overlayVideo.addEventListener("pause", updatePlayButton);

        // Mobile touch controls
        document
          .getElementById("video-player-subcontainer")
          .addEventListener("touchstart", showControlsTemporarily);

        // Try to load the video
        if (mainVideo.readyState >= 1) {
          onVideoLoaded();
        } else {
          setTimeout(function () {
            if (!videoLoaded) {
              showError();
            }
          }, 10000);
        }
      }

      // Start when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
      // --- Play/Pause Icon Toggle ---
      function updatePlayButtonIcon() {
        var playIcon = document.getElementById("playIcon");
        var pauseIcon = document.getElementById("pauseIcon");
        if (!playIcon || !pauseIcon) return;
        if (mainVideo.paused) {
          playIcon.style.display = "inline";
          pauseIcon.style.display = "none";
        } else {
          playIcon.style.display = "none";
          pauseIcon.style.display = "inline";
        }
      }
      mainVideo.addEventListener("play", updatePlayButtonIcon);
      mainVideo.addEventListener("pause", updatePlayButtonIcon);

      // --- Volume Icon Toggle ---
      function updateVolumeIcon() {
        var muted = mainVideo.muted || mainVideo.volume === 0;
        var volume = mainVideo.volume;
        var mutedIcon = document.getElementById("volumeMutedIcon");
        var lowIcon = document.getElementById("volumeLowIcon");
        var highIcon = document.getElementById("volumeHighIcon");
        if (!mutedIcon || !lowIcon || !highIcon) return;
        mutedIcon.style.display = muted ? "inline" : "none";
        lowIcon.style.display = !muted && volume < 0.5 ? "inline" : "none";
        highIcon.style.display = !muted && volume >= 0.5 ? "inline" : "none";
      }
      mainVideo.addEventListener("volumechange", updateVolumeIcon);
      mainVideo.addEventListener("play", updateVolumeIcon);
      mainVideo.addEventListener("pause", updateVolumeIcon);

      // --- Fullscreen Icon Toggle ---
      function updateFullscreenIcon() {
        var isFullscreen = !!document.fullscreenElement;
        var enterIcon = document.getElementById("fullscreenEnterIcon");
        var exitIcon = document.getElementById("fullscreenExitIcon");
        if (!enterIcon || !exitIcon) return;
        enterIcon.style.display = isFullscreen ? "none" : "inline";
        exitIcon.style.display = isFullscreen ? "inline" : "none";
      }
      document.addEventListener("fullscreenchange", updateFullscreenIcon);

      // Initialize icons on load
      document.addEventListener("DOMContentLoaded", function () {
        updatePlayButtonIcon();
        updateVolumeIcon();
        updateFullscreenIcon();
      });
      // --- Play/Pause Icon Toggle ---
      function updatePlayButtonIcon() {
        var playIcon = document.getElementById("playIcon");
        var pauseIcon = document.getElementById("pauseIcon");
        if (!playIcon || !pauseIcon) return;
        if (mainVideo.paused) {
          playIcon.style.display = "inline";
          pauseIcon.style.display = "none";
        } else {
          playIcon.style.display = "none";
          pauseIcon.style.display = "inline";
        }
      }
      mainVideo.addEventListener("play", updatePlayButtonIcon);
      mainVideo.addEventListener("pause", updatePlayButtonIcon);

      // --- Volume Icon Toggle ---
      function updateVolumeIcon() {
        var muted = mainVideo.muted || mainVideo.volume === 0;
        var volume = mainVideo.volume;
        var mutedIcon = document.getElementById("volumeMutedIcon");
        var lowIcon = document.getElementById("volumeLowIcon");
        var highIcon = document.getElementById("volumeHighIcon");
        if (!mutedIcon || !lowIcon || !highIcon) return;
        mutedIcon.style.display = muted ? "inline" : "none";
        lowIcon.style.display = !muted && volume < 0.5 ? "inline" : "none";
        highIcon.style.display = !muted && volume >= 0.5 ? "inline" : "none";
      }
      mainVideo.addEventListener("volumechange", updateVolumeIcon);
      mainVideo.addEventListener("play", updateVolumeIcon);
      mainVideo.addEventListener("pause", updateVolumeIcon);

      // --- Fullscreen Icon Toggle ---
      function updateFullscreenIcon() {
        var isFullscreen = !!document.fullscreenElement;
        var enterIcon = document.getElementById("fullscreenEnterIcon");
        var exitIcon = document.getElementById("fullscreenExitIcon");
        if (!enterIcon || !exitIcon) return;
        enterIcon.style.display = isFullscreen ? "none" : "inline";
        exitIcon.style.display = isFullscreen ? "inline" : "none";
      }
      document.addEventListener("fullscreenchange", updateFullscreenIcon);

      // Initialize icons on load
      document.addEventListener("DOMContentLoaded", function () {
        updatePlayButtonIcon();
        updateVolumeIcon();
        updateFullscreenIcon();
      });
    </script>
  </body>
